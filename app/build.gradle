plugins {
    id 'com.android.application'
}

android {
    namespace 'app.novaplay.modern'
    compileSdk 34

    defaultConfig {
        applicationId 'app.novaplay.modern'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '2.1.0'

        // the WireGuard engine ships a native library per processor type; phones are ARM
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // one fixed key, so every new build installs over the previous one
    signingConfigs {
        nova {
            storeFile file('nova.keystore')
            storePassword 'novaplay'
            keyAlias 'nova'
            keyPassword 'novaplay'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.nova
        }
        debug {
            signingConfig signingConfigs.nova
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // the WireGuard library asks for it
        coreLibraryDesugaringEnabled true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // show every unit test in the build log
    testOptions {
        unitTests.all {
            testLogging {
                events 'passed', 'failed', 'skipped'
                exceptionFormat 'full'
                showStandardStreams true
            }
        }
    }
}

dependencies {
    // built-in Cloudflare WARP: the official WireGuard tunnel library (wireguard-go + Android VpnService)
    implementation 'com.wireguard.android:tunnel:1.0.20230706'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // checks the configuration text against the real WireGuard parser before an APK is built
    testImplementation 'junit:junit:4.13.2'
}
