name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, novaplay2 ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run the unit tests, then build the release APK
        run: gradle testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlay-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK as a GitHub Release (download it from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: novaplay2-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: NovaPlay 2 build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
